<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bomber.css">

</head>

<body>

    <div id="menu" class="menu">
        <div id="mainMenu" class="menu-panel">
            <h2>Game Menu</h2>
            <button id="startBtn">Start</button>
            <button id="infoBtn">Info</button>
            <button id="settingsBtn">Settings</button>
            <button id="quitBtn">Quit</button>
        </div>
        <div id="pauseMenu" class="menu-panel" style="display:none;">
            <h2>Paused</h2>
            <button id="continueBtn">Continue</button>
            <button id="restartBtn">Restart</button>
            <button id="mainMenuBtn">Main Menu</button>
            <button id="settingsPauseBtn">Settings</button>
            <button id="infoPauseBtn">Info</button>
        </div>
    </div>
    <div id="hud">
        <span id="fps">FPS: 0</span>
        <span id="lives">Lives: 3</span>
        <span id="score">Score: 0</span>
        <span id="timer">Time: 0:00</span>
    </div>
    <div id="settingsMenu" class="modal">
        <div class="modal-content">
            <h2>Settings</h2>
            <div class="difficulty">
                <p class="difficulty-title">Select Difficulty</p>
                <div class="difficulty-buttons">
                    <button class="difficultyBtn" data-level="easy">Easy</button>
                    <button class="difficultyBtn" data-level="medium">Medium</button>
                    <button class="difficultyBtn" data-level="hard">Hard</button>
                </div> 
            </div>

            <div class="audio-settings">
                <button id="muteBtn">
                    <img id="muteIcon" src="enable-sound.png" alt="Mute/Unmute">
                </button>
                <input type="range" id="volumeSlider" min="0" max="100" value="50">
            </div>
            <button id="backBtn">Back</button>
        </div>
    </div>


    <div id="game"></div>
    <script type="module" src="./main.js"></script>


</body>

</html>
